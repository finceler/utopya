<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filizler Restoran - Kasa & Yönetim Paneli</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #1e272e; color: #fff; }
    
    .nav-bar { background: #0f1418; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #33d9b2; }
    .nav-title { font-size: 20px; font-weight: bold; color: #fbc531; }
    .nav-tabs { display: flex; gap: 10px; }
    .tab-btn { background: #2f3640; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
    .tab-btn:hover, .tab-btn.active { background: #33d9b2; color: #1e272e; }

    .content-section { padding: 20px; display: none; }
    .content-section.active { display: block; }

    .masalar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .masa-kart { background: #2f3640; border-radius: 10px; border-top: 6px solid #718093; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; min-height: 250px; }
    .masa-kart.yeni-siparis { border-top-color: #e84118; animation: pulse 2s infinite; }
    .masa-kart.hazir { border-top-color: #2ecc71; animation: pulseGreen 2s infinite; }
    .masa-kart.teslim-edildi { border-top-color: #00a8ff; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(232, 65, 24, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(232, 65, 24, 0); }
      100% { box-shadow: 0 0 0 0 rgba(232, 65, 24, 0); }
    }
    @keyframes pulseGreen {
      0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
      100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
    }

    .masa-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #485460; padding-bottom: 10px; font-weight: bold; font-size: 18px; }
    .durum-rozeti { font-size: 11px; padding: 3px 8px; border-radius: 12px; }
    .rozet-yeni { background: #e84118; color: #fff; }
    .rozet-hazir { background: #2ecc71; color: #fff; }
    .rozet-teslim { background: #00a8ff; color: #fff; }
    .rozet-bos { background: #718093; color: #fff; }

    .siparis-listesi { margin: 15px 0; font-size: 14px; color: #dcdde1; max-height: 200px; overflow-y: auto; }
    .siparis-item { display: flex; justify-content: space-between; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dashed #3d4652; }
    
    .toplam-bilgi { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-top: 1px solid #485460; padding-top: 10px; }
    .toplam-tutar { font-weight: bold; font-size: 18px; color: #fbc531; }

    .btn-group { display: flex; gap: 8px; }
    button.action-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
    .btn-teslim { background: #00a8ff; color: #fff; }
    .btn-odeme { background: #4cd137; color: #fff; }

    .admin-card { background: #2f3640; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    .form-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    input, select { padding: 10px; border-radius: 6px; border: 1px solid #485460; background: #1e272e; color: #fff; font-size: 14px; }
    .btn-add { background: #33d9b2; color: #1e272e; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    
    .menu-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .menu-table th, .menu-table td { padding: 12px; border-bottom: 1px solid #485460; text-align: left; }
    .menu-table th { background: #0f1418; color: #fbc531; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: #2f3640; padding: 20px; border-radius: 10px; text-align: center; border-left: 5px solid #33d9b2; }
    .stat-value { font-size: 24px; font-weight: bold; color: #fbc531; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <div class="nav-title">FİLİZLER RESTORAN - POS & YÖNETİM</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="sekmeDegistir('masalarTab', this)">🖥️ Masalar & Siparişler</button>
      <button class="tab-btn" onclick="sekmeDegistir('menuTab', this)">⚙️ Menü & Stok Yönetimi</button>
      <button class="tab-btn" onclick="sekmeDegistir('raporTab', this)">📊 Rapor & Gün Sonu</button>
    </div>
  </div>

  <!-- 1. SEKME: MASALAR VE SİPARİŞLER -->
  <div id="masalarTab" class="content-section active">
    <div class="masalar-grid" id="masalarGrid"></div>
  </div>

  <!-- 2. SEKME: MENÜ VE STOK YÖNETİMİ -->
  <div id="menuTab" class="content-section">
    <div class="admin-card">
      <h3>Yeni Ürün Ekle / Güncelle</h3>
      <div class="form-group">
        <select id="yeniKategori">
          <option value="BAŞLANGIÇ">BAŞLANGIÇ</option>
          <option value="ARA SICAK">ARA SICAK</option>
          <option value="ANA YEMEK">ANA YEMEK</option>
          <option value="İÇECEKLER">İÇECEKLER</option>
        </select>
        <input type="text" id="yeniUrunAdi" placeholder="Ürün Adı" style="flex:2;">
        <input type="number" id="yeniUrunFiyat" placeholder="Fiyat (TL)" step="0.5" style="flex:1;">
        <button class="btn-add" onclick="urunKaydet()">Kaydet / Güncelle</button>
      </div>
    </div>

    <div class="admin-card">
      <h3>Mevcut Menü & Stok Durumu</h3>
      <table class="menu-table">
        <thead>
          <tr>
            <th>Kategori</th>
            <th>Ürün Adı</th>
            <th>Fiyat</th>
            <th>Stok Durumu</th>
            <th>İşlemler</th>
          </tr>
        </thead>
        <tbody id="menuListesiBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 3. SEKME: RAPORLAMA VE GÜN SONU -->
  <div id="raporTab" class="content-section">
    <div class="stats-grid">
      <div class="stat-card">
        <div>Bugünkü Toplam Ciro</div>
        <div class="stat-value" id="toplamCiro">0.00 TL</div>
      </div>
      <div class="stat-card">
        <div>Tamamlanan Sipariş</div>
        <div class="stat-value" id="toplamSiparisAdet">0</div>
      </div>
    </div>

    <div class="admin-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Tamamlanan Geçmiş Siparişler</h3>
        <button class="btn-add" style="background:#e84118; color:#fff;" onclick="gunSonuKapat()">🔒 Gün Sonu Kapat ve Sıfırla</button>
      </div>
      <table class="menu-table">
        <thead>
          <tr>
            <th>Saat</th>
            <th>Masa</th>
            <th>İçerik</th>
            <th>Tutar</th>
          </tr>
        </thead>
        <tbody id="gecmisSiparisBody"></tbody>
      </table>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCQdLGooB_XKQkLn3eYHgl9bfHf_3_YwBc",
    authDomain: "utopya-capming.firebaseapp.com",
    databaseURL: "https://utopya-capming-default-rtdb.firebaseio.com",
    projectId: "utopya-capming",
    storageBucket: "utopya-capming.firebasestorage.app",
    messagingSenderId: "74208870746",
    appId: "1:74208870746:web:7acdc8aefb4dc7b695b363",
    measurementId: "G-QN4PQRV22X"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const masalar = ["Masa 1", "Masa 2", "Masa 3", "Masa 4", "Masa 5"];
  let masaDurumlari = {
    "Masa 1": { durum: "BOS", urunler: [] },
    "Masa 2": { durum: "BOS", urunler: [] },
    "Masa 3": { durum: "BOS", urunler: [] },
    "Masa 4": { durum: "BOS", urunler: [] },
    "Masa 5": { durum: "BOS", urunler: [] }
  };

  // CANLI SİPARİŞ DİNLEYİCİSİ
  db.ref('siparisler').on('child_added', snapshot => {
    const gelenData = snapshot.val();
    const masaNo = gelenData.masa;

    if (masaDurumlari[masaNo]) {
      const saatliUrunler = gelenData.urunler.map(u => ({ ...u, saat: gelenData.saat }));
      masaDurumlari[masaNo].urunler.push(...saatliUrunler);
      masaDurumlari[masaNo].durum = "YENI_SIPARIS";

      sesliUyari(587.33);
      ekranGuncelle();
    }
  });

  // MUTFAK BİLDİRİMLERİNİ DİNLEME (Aşçı "Hazırlandı" Dediğinde)
  db.ref('mutfakBildirimleri').on('child_added', snapshot => {
    const bildirim = snapshot.val();
    const masaNo = bildirim.masa;

    if (masaDurumlari[masaNo] && masaDurumlari[masaNo].urunler.length > 0) {
      masaDurumlari[masaNo].durum = "MUTFAKTA_HAZIR";
      sesliUyari(880); // Mutfak hazır uyarısı farklı tonda çalar
      ekranGuncelle();
    }
  });

  // MENÜ VERİSİNİ DİNLEME
  db.ref('menu').on('value', snap => {
    const menuData = snap.val() || {};
    const tbody = document.getElementById('menuListesiBody');
    tbody.innerHTML = '';

    for (const [kat, urunler] of Object.entries(menuData)) {
      urunler.forEach((u, index) => {
        tbody.innerHTML += `
          <tr>
            <td>${kat}</td>
            <td><strong>${u.name}</strong></td>
            <td>${u.price.toFixed(2)} TL</td>
            <td>
              <button style="background:${u.stok ? '#27ae60':'#c0392b'}; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;"
                onclick="stokDegistir('${kat}', ${index}, ${!u.stok})">
                ${u.stok ? 'Stokta Var' : 'Tükendi'}
              </button>
            </td>
            <td>
              <button style="background:#e74c3c; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;"
                onclick="urunSil('${kat}', ${index})">Sil</button>
            </td>
          </tr>
        `;
      });
    }
  });

  // GEÇMİŞ RAPORLARI DİNLEME
  db.ref('gecmisSiparisler').on('value', snap => {
    const data = snap.val() || {};
    const tbody = document.getElementById('gecmisSiparisBody');
    tbody.innerHTML = '';

    let ciro = 0;
    let adet = 0;

    Object.values(data).forEach(s => {
      ciro += s.toplam;
      adet++;
      const urunDetay = s.urunler.map(u => u.urun).join(', ');
      tbody.innerHTML += `
        <tr>
          <td>${s.saat}</td>
          <td>${s.masa}</td>
          <td>${urunDetay}</td>
          <td><strong>${s.toplam.toFixed(2)} TL</strong></td>
        </tr>
      `;
    });

    document.getElementById('toplamCiro').innerText = ciro.toFixed(2) + ' TL';
    document.getElementById('toplamSiparisAdet').innerText = adet;
  });

  function ekranGuncelle() {
    const grid = document.getElementById('masalarGrid');
    grid.innerHTML = '';

    masalar.forEach(masaNo => {
      const masa = masaDurumlari[masaNo];
      let toplamTutar = 0;

      let kartClass = 'masa-kart';
      let rozetHTML = '<span class="durum-rozeti rozet-bos">Boş</span>';

      if (masa.durum === "YENI_SIPARIS") {
        kartClass += ' yeni-siparis';
        rozetHTML = '<span class="durum-rozeti rozet-yeni">🔔 Yeni Sipariş</span>';
      } else if (masa.durum === "MUTFAKTA_HAZIR") {
        kartClass += ' hazir';
        rozetHTML = '<span class="durum-rozeti rozet-hazir">👨‍🍳 Mutfakta Hazır!</span>';
      } else if (masa.durum === "TESLIM_EDILDI") {
        kartClass += ' teslim-edildi';
        rozetHTML = '<span class="durum-rozeti rozet-teslim">✓ Teslim Edildi</span>';
      }

      let siparisHTML = '';
      if (masa.urunler.length > 0) {
        siparisHTML = masa.urunler.map(s => {
          toplamTutar += s.fiyat;
          return `<div class="siparis-item"><span>[${s.saat}] ${s.urun}</span><span>${s.fiyat.toFixed(2)} TL</span></div>`;
        }).join('');
      } else {
        siparisHTML = '<div style="color: #7f8c8d; text-align: center; padding-top: 40px;">Masa Boş</div>';
      }

      const kart = document.createElement('div');
      kart.className = kartClass;
      kart.innerHTML = `
        <div>
          <div class="masa-header"><span>${masaNo}</span>${rozetHTML}</div>
          <div class="siparis-listesi">${siparisHTML}</div>
        </div>
        <div>
          <div class="toplam-bilgi"><span>Toplam:</span><span class="toplam-tutar">${toplamTutar.toFixed(2)} TL</span></div>
          ${masa.urunler.length > 0 ? `
            <div class="btn-group">
              ${(masa.durum === "YENI_SIPARIS" || masa.durum === "MUTFAKTA_HAZIR") ? `<button class="action-btn btn-teslim" onclick="siparisTeslimEt('${masaNo}')">📦 Teslim Et</button>` : ''}
              <button class="action-btn btn-odeme" onclick="hesapKapat('${masaNo}',${toplamTutar})">💳 Hesabı Kapat</button>
            </div>
          ` : ''}
        </div>
      `;
      grid.appendChild(kart);
    });
  }

  function siparisTeslimEt(masaNo) {
    masaDurumlari[masaNo].durum = "TESLIM_EDILDI";
    ekranGuncelle();
  }

  function hesapKapat(masaNo, toplam) {
    if (confirm(`${masaNo} hesabını kapatmak ve ₺${toplam.toFixed(2)} tutarı kasaya işlemek istiyor musunuz?`)) {
      db.ref('gecmisSiparisler').push({
        masa: masaNo,
        urunler: masaDurumlari[masaNo].urunler,
        toplam: toplam,
        saat: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
      });

      masaDurumlari[masaNo] = { durum: "BOS", urunler: [] };
      ekranGuncelle();
    }
  }

  function urunKaydet() {
    const kat = document.getElementById('yeniKategori').value;
    const ad = document.getElementById('yeniUrunAdi').value.trim();
    const fiyat = parseFloat(document.getElementById('yeniUrunFiyat').value);

    if (!ad || isNaN(fiyat)) {
      alert('Lütfen geçerli ürün adı ve fiyatı giriniz!');
      return;
    }

    db.ref(`menu/${kat}`).once('value', snap => {
      let urunler = snap.val() || [];
      const varIdx = urunler.findIndex(u => u.name.toLowerCase() === ad.toLowerCase());

      if (varIdx > -1) {
        urunler[varIdx].price = fiyat;
      } else {
        urunler.push({ name: ad, price: fiyat, stok: true });
      }

      db.ref(`menu/${kat}`).set(urunler).then(() => {
        alert('Ürün başarıyla kaydedildi!');
        document.getElementById('yeniUrunAdi').value = '';
        document.getElementById('yeniUrunFiyat').value = '';
      });
    });
  }

  function stokDegistir(kat, index, durum) {
    db.ref(`menu/${kat}/${index}/stok`).set(durum);
  }

  function urunSil(kat, index) {
    if (confirm('Bu ürünü menüden silmek istediğinize emin misiniz?')) {
      db.ref(`menu/${kat}/${index}`).remove();
    }
  }

  function gunSonuKapat() {
    if (confirm('Günün ciro kayıtlarını arşivleyip raporu sıfırlamak istiyor musunuz?')) {
      db.ref('gecmisSiparisler').remove().then(() => {
        alert('Gün sonu başarıyla kapatıldı ve veriler sıfırlandı.');
      });
    }
  }

  function sekmeDegistir(tabId, btn) {
    document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  function sesliUyari(freq) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  }

  ekranGuncelle();
</script>

</body>
</html>
