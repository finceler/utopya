<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ütopya Camping & Restoran - Menü & Rezervasyon</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background: #f0f3f6; color: #2c3e50; }
    .container { max-width: 680px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); }
    h1 { text-align: center; color: #1e272e; margin: 0 0 5px 0; font-size: 24px; font-weight: 800; }
    .subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
    
    .main-tabs { display: flex; gap: 10px; margin-bottom: 20px; background: #e2e8f0; padding: 5px; border-radius: 10px; }
    .main-tab-btn { flex: 1; padding: 12px; border: none; background: transparent; border-radius: 8px; font-weight: bold; cursor: pointer; color: #4a5568; font-size: 15px; transition: all 0.2s; }
    .main-tab-btn.active { background: #27ae60; color: #fff; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .top-bar { background: #f8fafc; padding: 12px 16px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    select, input[type="text"], input[type="date"] { padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; }

    /* Kartlı Menü Tasarımı */
    .kategori-baslik { font-size: 16px; font-weight: bold; color: #2c3e50; margin: 20px 0 10px 0; border-left: 4px solid #27ae60; padding-left: 10px; text-transform: uppercase; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .menu-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: transform 0.2s; }
    .menu-card:hover { transform: translateY(-2px); border-color: #cbd5e1; }
    .card-title { font-weight: bold; font-size: 16px; color: #1e272e; margin-bottom: 4px; }
    .card-desc { font-size: 12px; color: #64748b; margin-bottom: 12px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .card-price { font-size: 16px; font-weight: 800; color: #27ae60; }

    .btn-ekle { background: #27ae60; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: background 0.2s; }
    .btn-ekle:hover { background: #219653; }
    .btn-ekle:disabled { background: #cbd5e1; cursor: not-allowed; }

    .sepet-kutusu { margin-top: 30px; border-top: 2px dashed #e2e8f0; padding-top: 20px; }
    .sepet-item { background: #f8fafc; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #e2e8f0; }
    .sepet-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; }
    .sepet-not-input { width: 95%; margin-top: 6px; padding: 6px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; }

    .btn-siparis { background: #2980b9; color: white; border: none; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(41, 128, 185, 0.3); }
    .pin-input { width: 120px; text-align: center; font-weight: bold; letter-spacing: 3px; font-size: 16px; }

    /* Kroki & Çadır Haritası */
    .tarih-secim-kutusu { background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 15px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
    .kroki-container { background: #f1f5f9; padding: 15px; border-radius: 12px; margin-top: 15px; border: 1px solid #e2e8f0; }
    .bolum-baslik { font-size: 13px; font-weight: bold; color: #64748b; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
    .cadir-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .cadir-box { background: #fff8e7; border: 2px solid #d4ac0d; padding: 14px 5px; border-radius: 10px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; user-select: none; }
    .cadir-box.serbest { background: #e8f8f5; border: 2px dashed #1abc9c; }
    .cadir-box.dolu { opacity: 0.4; cursor: not-allowed; background: #fadbd8; border-color: #e74c3c; }
    .cadir-box.secili { border: 3px solid #2980b9 !important; background-color: #d4e6f1 !important; box-shadow: 0 0 10px rgba(41, 128, 185, 0.6); transform: scale(1.03); }
    .nokta { width: 10px; height: 10px; border-radius: 50%; position: absolute; top: 6px; right: 6px; }
    .nokta.yesil { background: #2ecc71; }
    .nokta.kirmizi { background: #e74c3c; }
  </style>
</head>
<body>

<div class="container">
  <h1>ÜTOPYA CAMPING & RESTORAN</h1>
  <div class="subtitle">Çadır Alanı & Lezzet Menüsü</div>

  <div class="main-tabs">
    <button class="main-tab-btn active" onclick="anaSekmeDegistir('menuTab', this)">🍽️ Yemek Menüsü</button>
    <button class="main-tab-btn" onclick="anaSekmeDegistir('kampTab', this)">⛺ Çadır Rezervasyonu</button>
  </div>

  <!-- YEMEK MENÜSÜ SEKMESİ -->
  <div id="menuTab" class="tab-content active">
    <div class="top-bar">
      <div>
        <label for="masaSelect"><strong>Masa Seçin:</strong></label>
        <select id="masaSelect" style="font-weight:bold;">
          <option value="Masa 1">Masa 1</option>
          <option value="Masa 2">Masa 2</option>
          <option value="Masa 3">Masa 3</option>
          <option value="Masa 4">Masa 4</option>
          <option value="Masa 5">Masa 5</option>
        </select>
      </div>
      <button style="background:#e67e22; color:#fff; border:none; padding:10px 14px; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="garsonCagır()">🔔 Garson Çağır</button>
    </div>

    <div id="menuContainer">Menü yükleniyor...</div>

    <div class="sepet-kutusu">
      <h3 style="margin-top:0;">🛒 Sepetiniz</h3>
      <div id="sepetListesi"><small style="color:#7f8c8d;">Henüz ürün eklemediniz.</small></div>
      <div style="font-weight:800; font-size:18px; text-align:right; margin-top:12px; color:#c0392b;" id="toplamTutar">Toplam: 0.00 TL</div>
      
      <div style="margin-top:15px; background:#fff5f5; padding:12px; border-radius:8px; border:1px solid #feb2b2; display:flex; align-items:center; justify-content:space-between;">
        <label for="masaPin"><strong>🔑 Masa PIN Kodu:</strong></label>
        <input type="text" id="masaPin" class="pin-input" maxlength="4" placeholder="----">
      </div>

      <button class="btn-siparis" onclick="siparisGonder()">Siparişi Mutfak & Kasaya Gönder</button>
    </div>
  </div>

  <!-- ÇADIR REZERVASYONU SEKMESİ -->
  <div id="kampTab" class="tab-content">
    <h3 style="margin-top:0;">⛺ Kamp Alanı Rezervasyon Adımları</h3>
    
    <div class="tarih-secim-kutusu">
      <div>
        <label><strong>Giriş Tarihi:</strong></label><br>
        <input type="date" id="girisTarihi" onchange="tarihDegisti()">
      </div>
      <div>
        <label><strong>Çıkış Tarihi:</strong></label><br>
        <input type="date" id="cikisTarihi" onchange="tarihDegisti()">
      </div>
    </div>

    <div class="kroki-container">
      <div class="bolum-baslik">Hazır Çadır Bölgesi</div>
      <div class="cadir-grid" id="hazirCadirGrid"></div>

      <div class="bolum-baslik">Serbest Çadır Bölgesi (Parsel)</div>
      <div class="cadir-grid" id="serbestCadirGrid"></div>
    </div>

    <div style="margin-top:20px; background:#f8fafc; padding:15px; border-radius:10px; border:1px solid #e2e8f0;">
      <div style="margin-bottom:10px;"><strong>Seçilen Alan:</strong> <span id="secilenAlanText" style="color:#2980b9; font-weight:bold; font-size:16px;">Henüz Seçilmedi</span></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" id="resIsim" placeholder="Adınız Soyadınız" style="flex:1;">
        <input type="text" id="resTelefon" placeholder="Telefon Numaranız" style="flex:1;">
      </div>
      <button class="btn-siparis" style="background:#27ae60;" onclick="rezervasyonYap()">Rezervasyon Talebi Gönder</button>
    </div>
  </div>

</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCQdLGooB_XKQkLn3eYHgl9bfHf_3_YwBc",
    authDomain: "utopya-capming.firebaseapp.com",
    databaseURL: "https://utopya-capming-default-rtdb.firebaseio.com",
    projectId: "utopya-capming",
    storageBucket: "utopya-capming.firebasestorage.app",
    messagingSenderId: "74208870746",
    appId: "1:74208870746:web:7acdc8aefb4dc7b695b363",
    measurementId: "G-QN4PQRV22X"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const urlParams = new URLSearchParams(window.location.search);
  const urlMasa = urlParams.get('masa');
  if (urlMasa) document.getElementById('masaSelect').value = urlMasa;

  const bugun = new Date().toISOString().split('T')[0];
  const yarinObj = new Date(); yarinObj.setDate(yarinObj.getDate() + 1);
  const yarin = yarinObj.toISOString().split('T')[0];

  document.getElementById('girisTarihi').value = bugun;
  document.getElementById('cikisTarihi').value = yarin;
  document.getElementById('girisTarihi').min = bugun;
  document.getElementById('cikisTarihi').min = bugun;

  let sepet = [];
  let seciliCadir = null;
  let onayliRezervasyonlar = [];
  let mevcutDoluCadirlar = [];

  db.ref('onayliRezervasyonlar').on('value', snap => {
    onayliRezervasyonlar = Object.values(snap.val() || {});
    musaitlikHesapla();
  });

  function tarihDegisti() {
    seciliCadir = null;
    document.getElementById('secilenAlanText').innerText = 'Henüz Seçilmedi';
    musaitlikHesapla();
  }

  function musaitlikHesapla() {
    const giris = document.getElementById('girisTarihi').value;
    const cikis = document.getElementById('cikisTarihi').value;

    if (!giris || !cikis || giris >= cikis) return;
    mevcutDoluCadirlar = [];

    onayliRezervasyonlar.forEach(r => {
      if ((giris < r.cikisTarihi) && (cikis > r.girisTarihi)) {
        mevcutDoluCadirlar.push(r.alan);
      }
    });
    krokiCiz();
  }

  function krokiCiz() {
    const hazirGrid = document.getElementById('hazirCadirGrid');
    const serbestGrid = document.getElementById('serbestCadirGrid');
    hazirGrid.innerHTML = ''; serbestGrid.innerHTML = '';

    const hazirList = ["Çadır 1", "Çadır 2", "Çadır 3", "Çadır 4", "Çadır 5"];
    const serbestList = ["Parsel A", "Parsel B", "Parsel C", "Parsel D", "Parsel E"];

    hazirList.forEach(c => {
      const isDolu = mevcutDoluCadirlar.includes(c);
      const isSecili = seciliCadir === c;
      const div = document.createElement('div');
      div.className = `cadir-box ${isDolu ? 'dolu' : ''} ${isSecili ? 'secili' : ''}`;
      div.innerHTML = `<span class="nokta ${isDolu ? 'kirmizi' : 'yesil'}"></span>⛺<br><strong>${c}</strong>`;
      if (!isDolu) div.onclick = function() { cadirSec(c); };
      hazirGrid.appendChild(div);
    });

    serbestList.forEach(p => {
      const isDolu = mevcutDoluCadirlar.includes(p);
      const isSecili = seciliCadir === p;
      const div = document.createElement('div');
      div.className = `cadir-box serbest ${isDolu ? 'dolu' : ''} ${isSecili ? 'secili' : ''}`;
      div.innerHTML = `<span class="nokta ${isDolu ? 'kirmizi' : 'yesil'}"></span>⛺<br><strong>${p}</strong>`;
      if (!isDolu) div.onclick = function() { cadirSec(p); };
      serbestGrid.appendChild(div);
    });
  }

  function cadirSec(id) {
    seciliCadir = id;
    document.getElementById('secilenAlanText').innerText = id;
    krokiCiz();
  }

  function rezervasyonYap() {
    const isim = document.getElementById('resIsim').value.trim();
    const tel = document.getElementById('resTelefon').value.trim();
    const girisTarihi = document.getElementById('girisTarihi').value;
    const cikisTarihi = document.getElementById('cikisTarihi').value;

    if (!seciliCadir) return alert('Lütfen haritadan bir çadır/parsel seçin!');
    if (!isim || !tel) return alert('Lütfen bilgilerinizi girin!');

    db.ref('rezervasyonTalepleri').push({
      alan: seciliCadir, isim, tel, girisTarihi, cikisTarihi,
      saat: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
    }).then(() => {
      alert(`Sayın ${isim}, rezervasyon talebiniz iletildi.`);
      seciliCadir = null;
      document.getElementById('secilenAlanText').innerText = 'Henüz Seçilmedi';
      document.getElementById('resIsim').value = '';
      document.getElementById('resTelefon').value = '';
      krokiCiz();
    });
  }

  // Kartlı Menü Yükleme
  db.ref('menu').on('value', snap => {
    const menuData = snap.val() || {};
    const container = document.getElementById('menuContainer');
    container.innerHTML = '';

    for (const [kategori, urunler] of Object.entries(menuData)) {
      const katBaslik = document.createElement('div');
      katBaslik.className = 'kategori-baslik';
      katBaslik.innerText = kategori;
      container.appendChild(katBaslik);

      const gridDiv = document.createElement('div');
      gridDiv.className = 'menu-grid';

      urunler.forEach(u => {
        const card = document.createElement('div');
        card.className = 'menu-card';
        card.innerHTML = `
          <div>
            <div class="card-title">${u.name}</div>
            <div class="card-desc">${u.aciklama || 'Taze malzemelerle hazırlanan lezzet.'}</div>
          </div>
          <div class="card-footer">
            <span class="card-price">${u.price.toFixed(2)} TL</span>
            <button class="btn-ekle" ${!u.stok ? 'disabled' : ''} onclick="sepeteEkle('${u.name}', ${u.price})">
              ${u.stok ? '+ Sepete Ekle' : 'Tükendi'}
            </button>
          </div>
        `;
        gridDiv.appendChild(card);
      });
      container.appendChild(gridDiv);
    }
  });

  function sepeteEkle(urun, fiyat) {
    sepet.push({ urun, fiyat, not: '' });
    sepetiGuncelle();
  }

  function sepetNotGuncelle(index, val) {
    if (sepet[index]) sepet[index].not = val;
  }

  function sepettenCikar(index) {
    sepet.splice(index, 1);
    sepetiGuncelle();
  }

  function sepetiGuncelle() {
    const sepetDiv = document.getElementById('sepetListesi');
    const toplamDiv = document.getElementById('toplamTutar');
    if (sepet.length === 0) {
      sepetDiv.innerHTML = '<small style="color:#7f8c8d;">Henüz ürün eklemediniz.</small>';
      toplamDiv.innerText = 'Toplam: 0.00 TL';
      return;
    }
    let toplam = 0;
    sepetDiv.innerHTML = sepet.map((i, index) => { 
      toplam += i.fiyat; 
      return `
        <div class="sepet-item">
          <div class="sepet-header">
            <span>• ${i.urun} (${i.fiyat.toFixed(2)} TL)</span>
            <span style="color:#e74c3c; cursor:pointer;" onclick="sepettenCikar(${index})">✕</span>
          </div>
          <input type="text" class="sepet-not-input" placeholder="Malzeme çıkarma/not yazın (Örn: Soğansız, bol sos)" value="${i.not}" onchange="sepetNotGuncelle(${index}, this.value)">
        </div>`; 
    }).join('');
    toplamDiv.innerText = `Toplam: ${toplam.toFixed(2)} TL`;
  }

  function siparisGonder() {
    if (sepet.length === 0) return alert('Lütfen sepetinize ürün ekleyin!');
    const secilenMasa = document.getElementById('masaSelect').value;
    const girilenPin = document.getElementById('masaPin').value.trim();

    if (!girilenPin) return alert('Lütfen Masa PIN kodunu giriniz!');

    db.ref(`masaPinler/${secilenMasa}`).once('value', snap => {
      if (girilenPin !== snap.val()) {
        alert('❌ Hatalı Masa PIN Kodu!');
        return;
      }

      const saatFormat = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

      db.ref('siparisler').push({
        masa: secilenMasa,
        urunler: sepet,
        saat: saatFormat,
        tarih: Date.now()
      });

      db.ref('garsonGorevleri').push({
        masa: secilenMasa,
        urunler: sepet,
        saat: saatFormat,
        durum: "BEKLİYOR"
      }).then(() => {
        alert(`${secilenMasa} siparişiniz iletildi!`);
        sepet = [];
        document.getElementById('masaPin').value = '';
        sepetiGuncelle();
      });
    });
  }

  function garsonCagır() {
    const secilenMasa = document.getElementById('masaSelect').value;
    db.ref('siparisler').push({
      masa: secilenMasa,
      urunler: [{ urun: "🔔 GARSON ÇAĞRISI", fiyat: 0, not: "" }],
      saat: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' })
    }).then(() => alert(`${secilenMasa} için garson çağrısı gönderildi.`));
  }

  function anaSekmeDegistir(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }
</script>
</body>
</html>
