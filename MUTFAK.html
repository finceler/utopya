<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filizler Restoran - Mutfak Ekranı</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background: #2c3e50; color: #fff; }
    h1 { text-align: center; color: #e67e22; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #bdc3c7; font-size: 14px; margin-bottom: 25px; }

    .mutfak-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .siparis-karti { background: #34495e; border-radius: 10px; border-left: 8px solid #e74c3c; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .kart-header { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; border-bottom: 1px solid #7f8c8d; padding-bottom: 8px; margin-bottom: 10px; }
    .urun-item { font-size: 16px; margin-bottom: 8px; color: #ecf0f1; display: flex; align-items: center; gap: 8px; }
    .btn-hazir { background: #2ecc71; color: #fff; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 15px; }
    .btn-hazir:hover { background: #27ae60; }
  </style>
</head>
<body>

  <h1>👨‍🍳 MUTFAK & BAR SİPARİŞ EKRANI</h1>
  <div class="subtitle">Anlık Hazırlanacak Siparişler</div>

  <div class="mutfak-grid" id="mutfakGrid"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCQdLGooB_XKQkLn3eYHgl9bfHf_3_YwBc",
    authDomain: "utopya-capming.firebaseapp.com",
    databaseURL: "https://utopya-capming-default-rtdb.firebaseio.com",
    projectId: "utopya-capming",
    storageBucket: "utopya-capming.firebasestorage.app",
    messagingSenderId: "74208870746",
    appId: "1:74208870746:web:7acdc8aefb4dc7b695b363",
    measurementId: "G-QN4PQRV22X"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  db.ref('siparisler').on('child_added', snapshot => {
    const data = snapshot.val();
    const key = snapshot.key;

    // Sadece Garson Çağrısı Olmayan Gerçek Ürünleri Göster
    const yemekler = data.urunler.filter(u => u.urun !== "🔔 GARSON ÇAĞRISI");

    if (yemekler.length > 0) {
      sesliUyari();

      const grid = document.getElementById('mutfakGrid');
      const kart = document.createElement('div');
      kart.className = 'siparis-karti';
      kart.id = `mutfak-${key}`;

      const urunlerHTML = yemekler.map(u => `<div class="urun-item"><span>▶</span> <strong>${u.urun}</strong></div>`).join('');

      kart.innerHTML = `
        <div class="kart-header">
          <span>${data.masa}</span>
          <span style="font-size: 13px; color: #f39c12;">${data.saat}</span>
        </div>
        <div>${urunlerHTML}</div>
        <button class="btn-hazir" onclick="siparisTamamla('${key}', '${data.masa}')">✓ Hazırlandı / Kasaya Bildir</button>
      `;

      grid.prepend(kart);
    }
  });

  function siparisTamamla(key, masaNo) {
    // Kasa Ekranına "Mutfakta Hazır" bildirim durumu gönder
    db.ref('mutfakBildirimleri').push({
      masa: masaNo,
      saat: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
      tarih: Date.now()
    }).then(() => {
      const el = document.getElementById(`mutfak-${key}`);
      if (el) el.remove();
    });
  }

  function sesliUyari() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  }
</script>

</body>
</html>
